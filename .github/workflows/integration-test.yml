name: integration-tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  integration-tests:
    name: End-to-end integration tests
    runs-on: ubuntu-latest
    env:
      DRY_RUN: 'true'
      AUDIT_LOG_PATH: docs/generated/audit-log.ndjson
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SERVER_URL: ${{ github.server_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Create required output directories
        run: |
          mkdir -p docs/generated docs/output docs/backups

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            --junit-xml=docs/generated/integration-test-results.xml \
            -m integration

      - name: Generate integration report
        if: always()
        run: |
          python tests/integration/generate_report.py \
            --xml docs/generated/integration-test-results.xml \
            --out docs/generated/integration-report.json

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_id }}
          path: |
            docs/generated/integration-test-results.xml
            docs/generated/integration-report.json
            docs/generated/workflow-summary.json
            docs/generated/dry-run-report.json
            docs/generated/audit-log.ndjson
          retention-days: 30

      - name: Summarize results
        if: always()
        run: |
          echo "## Integration Test Summary" >> "$GITHUB_STEP_SUMMARY"
          python tests/integration/step_summary.py >> "$GITHUB_STEP_SUMMARY" || true
