name: documentation-sync

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write
  contents: write
  issues: write

jobs:
  core-workflow:
    name: Core workflow execution
    runs-on: ubuntu-latest
    env:
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      AUDIT_LOG_PATH: docs/generated/audit-log.ndjson
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changes
        env:
          BASE_REF: origin/main
        run: |
          python scripts/detect_changes.py

      - name: Generate documentation artifacts
        env:
          BASE_REF: origin/main
        run: |
          python scripts/generate_docs.py

      - name: Validate generated documentation
        run: |
          python scripts/validate_docs.py

      - name: Scan for secrets in generated documentation
        run: |
          python scripts/scan_secrets.py

      - name: Create documentation backup
        run: |
          python scripts/backup_docs.py backup

      - name: Create Pull Request with generated docs
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
        run: |
          python scripts/create_pr.py

      - name: Notify PR ready for review
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_RESULT_PATH: docs/generated/pr-result.json
        run: |
          python scripts/notify.py pr_ready --pr-result docs/generated/pr-result.json

      - name: Approval gate for generated docs
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_RESULT_PATH: docs/generated/pr-result.json
        run: |
          python scripts/approval_gate.py

      - name: Notify workflow success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python scripts/notify.py workflow_success

      - name: Notify workflow failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python scripts/notify.py workflow_failure

      - name: Summarize workflow execution
        run: |
          echo "Core workflow execution completed"
          echo "Validation, secret scanning, and backup creation completed successfully"
