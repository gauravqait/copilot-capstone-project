# Pipeline configuration for the documentation synchronization workflow
# This file defines the foundation settings for the initial implementation phase.

workflow:
  name: documentation-sync
  trigger_branch: main
  timeout_minutes: 15
  retries: 2

repository:
  docs_output_path: docs/output
  docs_backup_path: docs/backups
  docs_generated_path: docs/generated
  templates_path: config/templates

security:
  require_branch_protection: true
  require_approval: true
  secret_scanning_enabled: true
